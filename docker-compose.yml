services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: datashare
      POSTGRES_USER: datashare
      POSTGRES_PASSWORD: datashare
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datashare"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend-nest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://datashare:datashare@db:5432/datashare
      JWT_SECRET: change-me-in-production
      JWT_EXPIRES_IN: 7d
      MAX_FILE_SIZE: "1073741824"
      SHARE_LINK_EXPIRY_HOURS: "168"
      UPLOAD_DIR: uploads
      PORT: "8000"
      FRONTEND_URL: http://localhost:5173
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://backend:8000"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
