openapi: 3.0.3
info:
  title: DataShare API
  description: API REST de la plateforme DataShare — transfert sécurisé de fichiers. Authentification via JWT Bearer token.
  version: 1.0.0

servers:
  - url: http://localhost:8000/api
    description: Développement local

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UserProfile:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          example: alice@example.com
        username:
          type: string
          example: alice

    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: '#/components/schemas/UserProfile'

    FileResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        original_name:
          type: string
          example: rapport.pdf
        size:
          type: integer
          example: 204800
        content_type:
          type: string
          example: application/pdf
        share_token:
          type: string
          format: uuid
        share_url:
          type: string
          example: http://localhost:5173/download/abc-123
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        is_expired:
          type: boolean
          example: false
        is_password_protected:
          type: boolean
          example: false

    Error:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          type: string

paths:

  /auth/register:
    post:
      summary: Créer un compte utilisateur (US03)
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - username
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: alice@example.com
                username:
                  type: string
                  minLength: 3
                  example: alice
                password:
                  type: string
                  minLength: 8
                  example: motdepasse123
      responses:
        '201':
          description: Compte créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: Données invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email déjà utilisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      summary: Connexion utilisateur (US04)
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: alice@example.com
                password:
                  type: string
                  example: motdepasse123
      responses:
        '200':
          description: Connexion réussie — retourne un JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Identifiants invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/me:
    get:
      summary: Profil de l'utilisateur connecté
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profil utilisateur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Token manquant ou invalide

  /files:
    get:
      summary: Historique des fichiers de l'utilisateur (US05)
      tags:
        - Fichiers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Liste des fichiers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileResponse'
        '401':
          description: Non authentifié

  /files/upload:
    post:
      summary: Upload d'un fichier avec compte (US01)
      tags:
        - Fichiers
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                expiry_hours:
                  type: integer
                  minimum: 1
                  maximum: 168
                  example: 48
                password:
                  type: string
                  minLength: 6
                  description: Mot de passe optionnel (US09)
      responses:
        '201':
          description: Fichier uploadé — lien de partage généré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileResponse'
        '401':
          description: Non authentifié
        '403':
          description: Extension de fichier interdite (.exe, .bat, .sh...)

  /files/upload/anonymous:
    post:
      summary: Upload anonyme sans compte (US07)
      tags:
        - Fichiers
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                expiry_hours:
                  type: integer
                  minimum: 1
                  maximum: 168
                password:
                  type: string
                  minLength: 6
      responses:
        '201':
          description: Fichier uploadé — lien de partage généré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileResponse'
        '403':
          description: Extension de fichier interdite

  /files/share/{token}:
    get:
      summary: Métadonnées publiques d'un fichier (US02)
      tags:
        - Fichiers
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Métadonnées du fichier sans chemin disque ni hash mot de passe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileResponse'
        '404':
          description: Token inconnu

  /files/download/{token}:
    get:
      summary: Téléchargement d'un fichier (US02)
      tags:
        - Fichiers
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: password
          in: query
          required: false
          schema:
            type: string
          description: Mot de passe si le fichier est protégé
      responses:
        '200':
          description: Fichier binaire en streaming
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '403':
          description: Mot de passe incorrect
        '404':
          description: Token inconnu
        '410':
          description: Lien expiré

  /files/{id}:
    delete:
      summary: Suppression d'un fichier (US06)
      tags:
        - Fichiers
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Fichier supprimé physiquement et en base de données
        '401':
          description: Non authentifié
        '404':
          description: Fichier introuvable ou n'appartient pas à l'utilisateur
